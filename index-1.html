<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Master Karaoke en Casa · DJ Alan Alvarado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#17120d;--mut:#6d6157;--line:#eadfd2;--acc:#d4650a;--accink:#fff;--card:#fff6ea;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c0a;--ink:#f6efe6;--mut:#a99d90;--line:#2b241e;--acc:#ffb02e;--accink:#1a1209;--card:#1a1511}}
:root[data-theme="dark"]{--bg:#0e0c0a;--ink:#f6efe6;--mut:#a99d90;--line:#2b241e;--acc:#ffb02e;--accink:#1a1209;--card:#1a1511}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.top{text-align:center;padding:22px 16px 14px}
.logo{width:min(250px,70vw);border-radius:16px;border:2px solid var(--acc);box-shadow:0 0 28px color-mix(in srgb,var(--acc) 35%,transparent)}
h1{font:700 30px/1.05 "Barlow Condensed",Impact,sans-serif;margin:14px 0 4px}
.sub{margin:0;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;background:var(--bg);padding:8px 14px 6px;border-bottom:1px solid var(--line)}
.sb{width:100%;font:500 17px Barlow,system-ui,sans-serif;padding:13px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.sb:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-width:34px;height:34px;border-radius:17px;border:1px solid var(--line);background:none;color:var(--ink);font:600 14px Barlow,sans-serif}
.chips button:active{background:var(--acc);color:var(--accink)}
main{max-width:720px;margin:0 auto;padding:0 14px 96px}
.cnt{margin:12px 2px;color:var(--mut);font-size:14px}
h2{font:700 24px/1 "Barlow Condensed",Impact,sans-serif;color:var(--acc);margin:22px 2px 4px;scroll-margin-top:130px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.row span{min-width:0;overflow-wrap:anywhere}
.row b{flex:none;font:600 14px Barlow,sans-serif;background:var(--acc);color:var(--accink);padding:7px 14px;border-radius:999px}
.row:focus-visible,.cta:focus-visible,.chips button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.who{max-width:420px;margin:16px auto 0;text-align:left}
.who label{display:block;font-weight:500;margin:0 2px 6px}
.hint{color:var(--acc);font-weight:500;margin:6px 2px 0}
.hint[hidden]{display:none}
.none{text-align:center;padding:36px 10px;color:var(--mut)}
.none a{display:inline-block;margin-top:12px}
.cta{display:inline-block;background:var(--acc);color:var(--accink);font:600 16px Barlow,sans-serif;padding:12px 20px;border-radius:999px;text-decoration:none}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:22;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);text-align:center}
.fab .cta{box-shadow:0 4px 18px rgba(0,0,0,.3)}
</style>
</head>
